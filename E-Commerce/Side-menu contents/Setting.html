<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="../side-menu.css">
</head>

<body>

    <div class="sidebar" id="sidebar">

        <div class="logo">
            <img src="../Logo.png" alt="CodeCrave Logo" class="sidebar-logo">
            <span>CodeCrave</span>
        </div>

        <div class="menu-group">

            <h4>Main Navigation</h4>

            <a href="Home.html" class="menu-link">
                🏠 Home
            </a>

            <a href="Products.html" class="menu-link">
                📦 Products
            </a>

            <a href="Categories.html" class="menu-link">
                📂 Categories
            </a>

        </div>

        <div class="menu-group">

            <h4>Shopping</h4>

            <a href="Cart.html" class="menu-link">
                🛒 Cart
                <span class="cart-count" id="cartCount">0</span>
            </a>

            <a href="My Orders.html" class="menu-link">
                📋 My Orders
            </a>

            <a href="Wishlist.html" class="menu-link">
                ❤️ Wishlist
            </a>

        </div>

        <div class="menu-group">

            <h4>Account</h4>

            <a href="Profile.html" class="menu-link">
                👤 Profile
            </a>

            <a href="Setting.html" class="menu-link active">
                ⚙️ Settings
            </a>

        </div>

        <div class="menu-group">

            <h4>System</h4>

            <a href="#" id="logoutBtn">
                🚪 Logout
            </a>

        </div>

    </div>


    <div class="main-content">

        <button class="toggle-btn" id="toggleBtn">
            ☰
        </button>

        <section id="settings" class="content-section active-section">

            <h1>⚙️ Settings</h1>

            <div class="settings-box">

                <h3>Account Settings</h3>

                <label>
                    <input type="checkbox" checked>
                    Allow account updates
                </label>

                <h3>Privacy Settings</h3>

                <label>
                    <input type="checkbox" checked>
                    Keep my profile private
                </label>

                <h3>Notification Settings</h3>

                <label>
                    <input type="checkbox" checked>
                    Receive order notifications
                </label>

            </div>

        </section>

    </div>


    <script src="../side-menu.js"></script>

</body>
</html>
